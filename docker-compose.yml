version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/emailagent
      - REDIS_URL=redis://redis:6379/0
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/emailagent
      - REDIS_URL=redis://redis:6379/0
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=emailagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    # Skip volume mounting node_modules to avoid cross-platform issues
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
